name: android

on:
  push:
    branches: [main]
    tags:
      - 'apk-*'
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION_NAME: 1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      apk: ${{ steps.collect.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Android SDK components
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK=$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null

      - name: Signing keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > keystore.properties
            echo "release keystore injected"
          else
            echo "::warning::no keystore secret, fallback to debug signing"
          fi

      - name: Build release APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            export VERSION_NAME="$(echo "${GITHUB_REF_NAME}" | sed 's/^apk-//')"
          else
            export VERSION_NAME="1.0.0"
          fi
          echo "VERSION_NAME=$VERSION_NAME"
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect
        id: collect
        run: |
          NAME="DSHWebAPI-${GITHUB_REF_NAME:-dev}.apk"
          NAME="$(echo "$NAME" | sed 's|/|_|g')"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          ls -la "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.collect.outputs.name }}
          if-no-files-found: error

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: ./apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash .github/e2e.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-shot
          path: shot.png
          if-no-files-found: warn

  release:
    needs: [build, e2e]
    if: startsWith(github.ref, 'refs/tags/apk-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: ./apk
      - uses: softprops/action-gh-release@v2
        with:
          name: DSH Web API ${{ github.ref_name }}
          files: ./apk/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
